<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcards — Homemade TOEIC Trainer</title><style>body{margin:0;background:#fffdf8;color:#22324b;font-family:system-ui;line-height:1.55}.wrap{max-width:760px;margin:auto;padding:24px 16px 70px}.card{background:#fff;border:1px solid #ece6da;border-radius:18px;padding:24px;margin:16px 0}.btn{min-height:48px;border:1px solid #e5ded2;background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer}.primary{background:#4f7cff;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f8f4ec;border-radius:12px;padding:12px;text-align:center}.word{font-size:2rem;font-weight:850}.muted{color:#5a6b82}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><a href="index.html">← Accueil</a><h1>🃏 Flashcards</h1><p>Révision espacée reliée à <strong>My Words</strong>. Les dates utilisent l'heure locale de ton appareil.</p><div class="stats"><div class="stat"><b id="total">0</b><br>Total</div><div class="stat"><b id="due">0</b><br>À revoir</div><div class="stat"><b id="master">0</b><br>Maîtrisés</div><div class="stat"><b id="today">0</b><br>Aujourd'hui</div></div><div class="row" style="margin-top:14px"><button class="btn primary" id="review">Réviser mes mots</button><button class="btn" id="learn">Apprendre 20 nouveaux</button><select class="btn" id="theme"><option>Tous</option></select></div><section id="stage"></section></main><script src="toeic-bank.js"></script><script src="toeic-bank-fixes.js"></script><script>
"use strict";const KEY='l1toeic.v1',INT={1:1,2:2,3:4,4:7,5:15},$=id=>document.getElementById(id);function day(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');x.mywords=Array.isArray(x.mywords)?x.mywords:[];return x}catch(e){return{mywords:[]}}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function diff(a){if(!a)return 9999;let [y,m,d]=a.split('-').map(Number),then=new Date(y,m-1,d),now=new Date();now=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((now-then)/86400000)}function due(w){return !w.last||diff(w.last)>=(INT[Math.max(1,Math.min(5,+w.box||1))]||1)}function stats(){let x=load(),m=x.mywords;$('#total').textContent=m.length;$('#due').textContent=m.filter(due).length;$('#master').textContent=m.filter(w=>(+w.box||1)>=5).length;$('#today').textContent=x.flashMeta&&x.flashMeta.date===day()?x.flashMeta.count||0:0}let mode='review',queue=[],pos=0;function themes(){let set=[...new Set((TOEIC_BANK.VOCAB||[]).map(v=>v.t).filter(Boolean))].sort();set.forEach(t=>$('#theme').add(new Option(t,t)))}function build(){let x=load(),have=new Set(x.mywords.map(w=>w.w)),bank=TOEIC_BANK.VOCAB||[];if(mode==='review')queue=x.mywords.filter(due).sort((a,b)=>diff(b.last)-diff(a.last));else queue=bank.filter(v=>!have.has(v.w)&&($('#theme').value==='Tous'||v.t===$('#theme').value)).sort(()=>Math.random()-.5).slice(0,20);pos=0;render()}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=localStorage.getItem('ht_accent')||'en-GB';u.rate=.92;speechSynthesis.speak(u)}function render(){stats();let st=$('#stage');if(!queue.length||pos>=queue.length){st.innerHTML='<div class="card"><h2>'+ (mode==='review'?'Rien à réviser maintenant 🎉':'Session terminée')+'</h2></div>';return}let w=queue[pos],box=Math.max(1,Math.min(5,+w.box||1));st.innerHTML='<div class="card"><div class="muted">Carte '+(pos+1)+' / '+queue.length+' · boîte '+box+'/5</div><button class="btn" id="audio">🔊 Écouter</button><div class="word">'+w.w+'</div><div class="muted">'+(w.ipa||'')+'</div><div id="answer" hidden><h3>'+ (w.fr||'')+'</h3><p>'+ (w.ex||'')+'</p><div class="row"><button class="btn" id="again">À revoir</button><button class="btn primary" id="know">Je connais</button></div></div><button class="btn primary" id="flip" style="margin-top:14px">Voir la réponse</button></div>';$('#audio').onclick=()=>speak(w.w);$('#flip').onclick=()=>{$('#answer').hidden=false;$('#flip').hidden=true};$('#again').onclick=()=>rate(false);$('#know').onclick=()=>rate(true)}function rate(ok){let x=load(),w=queue[pos],idx=x.mywords.findIndex(z=>z.w===w.w);if(idx<0){x.mywords.push({w:w.w,fr:w.fr,ipa:w.ipa,ex:w.ex,t:w.t,box:1,last:null});idx=x.mywords.length-1}let z=x.mywords[idx];z.box=Math.max(1,Math.min(5,(+z.box||1)+(ok?1:-1)));z.last=day();x.flashMeta=x.flashMeta&&x.flashMeta.date===day()?x.flashMeta:{date:day(),count:0};x.flashMeta.count++;save(x);pos++;render()}$('#review').onclick=()=>{mode='review';build()};$('#learn').onclick=()=>{mode='learn';build()};$('#theme').onchange=()=>{if(mode==='learn')build()};themes();stats();build();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
