<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pronunciation & Listening — Homemade TOEIC Trainer</title><style>body{margin:0;background:#fffdf8;color:#22324b;font-family:system-ui;line-height:1.55}.wrap{max-width:820px;margin:auto;padding:24px 16px 70px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn,.opt{border:1px solid #e5ded2;background:#fff;border-radius:12px;min-height:48px;padding:9px 13px;font-weight:750;cursor:pointer}.tab[aria-selected=true],.btn.primary{background:#4f7cff;color:#fff}.card{background:#fff;border:1px solid #ece6da;border-radius:18px;padding:20px;margin-top:16px}.opts{display:grid;gap:9px;margin-top:14px}.opt{text-align:left}.opt.correct{border-color:#1e7a46;background:#eaf7ec}.opt.wrong{border-color:#a23f2d;background:#ffede9}.fb{margin-top:12px;padding:12px;border-radius:12px;background:#f8f4ec}.transcript{margin-top:12px}.small{color:#5a6b82;font-size:.88rem}:focus-visible{outline:3px solid #4f7cff;outline-offset:3px}</style></head><body><main class="wrap"><a href="index.html">← Accueil</a><h1>Pronunciation & Listening</h1><p>Entraînement audio : paires minimales, nombres, accentuation et mini-dialogues. L'audio démarre uniquement quand tu le demandes.</p><div class="tabs" id="tabs" role="tablist"></div><section class="card" id="panel"></section></main><script>
"use strict";const PAIRS=[{s:"I can send the file today.",o:["I can send the file today.","I can't send the file today."],a:0,t:"can / can't : écoute la consonne finale et le rythme."},{s:"The ship is ready.",o:["The ship is ready.","The sheep is ready."],a:0,t:"ship /ɪ/ vs sheep /iː/."},{s:"Please correct it.",o:["Please collect it.","Please correct it."],a:1,t:"L / R : correct et collect."},{s:"Could you fill the form?",o:["Could you fill the form?","Could you feel the form?"],a:0,t:"fill /ɪ/ vs feel /iː/."}];const NUM=[{s:"thirty",o:["13","30"],a:1,t:"THIR-ty = 30 ; thir-TEEN = 13."},{s:"fourteen",o:["14","40"],a:0,t:"four-TEEN = 14."},{s:"The meeting starts at two fifteen.",o:["2:15","2:50","2:05"],a:0,t:"fif-TEEN = 15."},{s:"It costs fifteen fifty.",o:["$15.50","$50.15","$15.15"],a:0,t:"fifteen fifty = 15.50."},{s:"Flight 207 departs from gate twelve.",o:["gate 12","gate 20","gate 2"],a:0,t:"twelve = 12."},{s:"We sold ninety units last week.",o:["19","90"],a:1,t:"NINE-ty = 90."}];const ST=[{s:"Please record the record.",o:["RE-cord (verb)","re-CORD (verb)"],a:1,t:"The verb is usually re-CORD; the noun is usually RE-cord."},{s:"I will present the present.",o:["PRE-sent (noun)","pre-SENT (noun)"],a:0,t:"The noun is PRE-sent; the verb is pre-SENT."},{s:"We expect sales to increase after the increase.",o:["IN-crease (verb)","in-CREASE (verb)"],a:1,t:"Verb: in-CREASE; noun: IN-crease."},{s:"The employee signed the form.",o:["em-PLOY-ee","em-ploy-EE"],a:1,t:"Standard pronunciation: employ-EE /ɪmˌplɔɪˈiː/."},{s:"The delivery arrived today.",o:["de-LIV-er-y","DEL-iv-er-y"],a:0,t:"delivery: stress on the second syllable."},{s:"I have an appointment tomorrow.",o:["ap-POINT-ment","AP-point-ment"],a:0,t:"appointment: stress on POINT."},{s:"The equipment needs maintenance.",o:["MAIN-te-nance","main-TE-nance"],a:0,t:"maintenance: first syllable stressed."},{s:"The committee approved the plan.",o:["COM-mit-tee","com-MIT-tee"],a:1,t:"committee: stress on MIT."}];const D=[{lines:["Man: Hi, I'd like to return this printer. It stopped working after two days.","Woman: I'm sorry to hear that. Do you have your receipt?","Man: Yes, here it is. I'd prefer a refund rather than a replacement."],q:"What does the man want?",o:["A replacement","A refund","A discount","A repair"],a:1,t:"He says: I'd prefer a refund."},{lines:["Woman: The training session has been moved from Tuesday to Thursday.","Man: Thursday? I have a client meeting that morning.","Woman: Don't worry, the training is in the afternoon, at two o'clock."],q:"When will the training take place?",o:["Tuesday morning","Thursday morning","Thursday afternoon","Tuesday afternoon"],a:2,t:"Thursday + in the afternoon."},{lines:["Narrator: Attention passengers. Flight 207 to Berlin has been delayed due to bad weather. Please remain near gate 12 for further announcements."],q:"Why is the flight delayed?",o:["A technical problem","Bad weather","A strike","A security check"],a:1,t:"It is delayed due to bad weather."}];const SETS=[['Paires minimales',PAIRS],['Nombres & heures',NUM],['Accentuation',ST],['Mini-dialogues',D]];let set=0,idx=0,answered=false;const state=(()=>{try{return JSON.parse(localStorage.getItem('htt_pron')||'{}')}catch(e){return{}}})();const $=s=>document.querySelector(s);function save(){localStorage.setItem('htt_pron',JSON.stringify(state))}function speak(text,slow){if(!('speechSynthesis'in window))return alert('Synthèse vocale indisponible sur cet appareil.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=localStorage.getItem('ht_accent')||'en-GB';u.rate=slow?.65:.92;speechSynthesis.speak(u)}function audioText(it){return it.lines?it.lines.map(x=>x.replace(/^[^:]+:\s*/,'' )).join(' '):it.s}function renderTabs(){let h=$('#tabs');h.innerHTML='';SETS.forEach((s,i)=>{let b=document.createElement('button');b.className='tab';b.textContent=s[0];b.setAttribute('aria-selected',String(i===set));b.onclick=()=>{set=i;idx=0;renderTabs();render()};h.appendChild(b)})}function render(){answered=false;let it=SETS[set][1][idx],p=$('#panel');p.innerHTML='<div class="small">Item '+(idx+1)+' / '+SETS[set][1].length+'</div><h2>'+SETS[set][0]+'</h2>'+(it.q?'<p><strong>Question :</strong> '+it.q+'</p>':'')+'<div class="actions"><button class="btn primary" id="play">▶ Écouter</button><button class="btn" id="slow">🐢 Plus lentement</button></div><div class="opts" id="opts"></div><div id="fb"></div>';$('#play').onclick=()=>speak(audioText(it),false);$('#slow').onclick=()=>speak(audioText(it),true);let o=$('#opts');it.o.forEach((x,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+x;b.onclick=()=>choose(i,b,it);o.appendChild(b)});if(it.lines){let d=document.createElement('details');d.className='transcript';d.innerHTML='<summary>Transcription — disponible après avoir répondu</summary><p>'+it.lines.join('<br>')+'</p>';d.disabled=true;p.appendChild(d)}}function choose(i,b,it){if(answered)return;answered=true;let ok=i===it.a,key='d'+set;state[key]=state[key]||{c:0,t:0};state[key].t++;if(ok)state[key].c++;save();[...$('#opts').children].forEach((x,j)=>{x.disabled=true;if(j===it.a)x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});let f=$('#fb');f.className='fb';f.innerHTML=(ok?'✅ Correct. ':'❌ À revoir. ')+it.t+'<br><button class="btn" id="next" style="margin-top:10px">'+(idx<SETS[set][1].length-1?'Suivant →':'Recommencer ↺')+'</button>';let det=$('.transcript');if(det)det.disabled=false;$('#next').onclick=()=>{idx=idx<SETS[set][1].length-1?idx+1:0;render()}}renderTabs();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
