<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4F7CFF"><title>Pronunciation & Listening — Homemade TOEIC Trainer</title><link rel="icon" href="icon.svg"><style>
:root{--blue:#4f7cff;--ink:#22324b;--muted:#5b6478;--line:#e4e8f2;--ok:#1e7a46;--okbg:#eaf7ec;--bad:#a23f2d;--badbg:#ffede9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff,#f9fbff);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}.wrap{max-width:880px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.sub{color:var(--muted)}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn,.opt{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:9px 13px;font-weight:750;cursor:pointer}.tab[aria-selected=true],.btn.primary{background:var(--blue);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 9px 25px rgba(34,50,75,.06)}.opts{display:grid;gap:9px;margin-top:14px}.opt{text-align:left}.opt.correct{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}.fb{margin-top:12px;padding:12px;border-radius:12px;background:#f7f9ff}.transcript{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcff}.small{color:var(--muted);font-size:.88rem}.live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}@media(max-width:600px){.top{display:block}.actions .btn{flex:1}}
</style><script src="progress-core.js"></script></head><body><main class="wrap"><a href="index.html">← Accueil</a><div class="top"><div><h1>Pronunciation & Listening</h1><p class="sub">Paires minimales, nombres, accentuation et mini-dialogues. <strong>Aucun autoplay</strong> : tu déclenches chaque écoute.</p></div></div><div class="tabs" id="tabs" role="tablist" aria-label="Types d'entraînement"></div><section class="card" id="panel" aria-live="off"></section><div id="live" class="live" aria-live="polite"></div></main><script>
"use strict";
const BANK={
pairs:[{s:"I can send the file today.",o:["I can send the file today.","I can't send the file today."],c:"I can send the file today.",t:"can / can't : écoute la consonne finale et le rythme."},{s:"The ship is ready.",o:["The ship is ready.","The sheep is ready."],c:"The ship is ready.",t:"ship /ɪ/ vs sheep /iː/."},{s:"Please correct it.",o:["Please collect it.","Please correct it."],c:"Please correct it.",t:"L / R : correct et collect."},{s:"Could you fill the form?",o:["Could you fill the form?","Could you feel the form?"],c:"Could you fill the form?",t:"fill /ɪ/ vs feel /iː/."}],
nums:[{s:"thirty",o:["13","30"],c:"30",t:"THIR-ty = 30 ; thir-TEEN = 13."},{s:"fourteen",o:["14","40"],c:"14",t:"four-TEEN = 14."},{s:"The meeting starts at two fifteen.",o:["2:15","2:50","2:05"],c:"2:15",t:"fif-TEEN = 15."},{s:"It costs fifteen fifty.",o:["$15.50","$50.15","$15.15"],c:"$15.50",t:"fifteen fifty = 15.50."},{s:"Flight 207 departs from gate twelve.",o:["gate 12","gate 20","gate 2"],c:"gate 12",t:"twelve = 12."},{s:"We sold ninety units last week.",o:["19","90"],c:"90",t:"NINE-ty = 90."}],
stress:[{s:"Please record the record.",o:["RE-cord (verb)","re-CORD (verb)"],c:"re-CORD (verb)",t:"The verb is usually re-CORD; the noun is usually RE-cord."},{s:"I will present the present.",o:["PRE-sent (noun)","pre-SENT (noun)"],c:"PRE-sent (noun)",t:"The noun is PRE-sent; the verb is pre-SENT."},{s:"We expect sales to increase after the increase.",o:["IN-crease (verb)","in-CREASE (verb)"],c:"in-CREASE (verb)",t:"Verb: in-CREASE; noun: IN-crease."},{s:"The employee signed the form.",o:["em-PLOY-ee","em-ploy-EE"],c:"em-ploy-EE",t:"Standard pronunciation: employ-EE /ɪmˌplɔɪˈiː/."},{s:"The delivery arrived today.",o:["de-LIV-er-y","DEL-iv-er-y"],c:"de-LIV-er-y",t:"delivery: stress on the second syllable."},{s:"I have an appointment tomorrow.",o:["ap-POINT-ment","AP-point-ment"],c:"ap-POINT-ment",t:"appointment: stress on POINT."},{s:"The equipment needs maintenance.",o:["MAIN-te-nance","main-TE-nance"],c:"MAIN-te-nance",t:"maintenance: first syllable stressed."},{s:"The committee approved the plan.",o:["COM-mit-tee","com-MIT-tee"],c:"com-MIT-tee",t:"committee: stress on MIT."}],
dialogues:[{lines:["Man: Hi, I'd like to return this printer. It stopped working after two days.","Woman: I'm sorry to hear that. Do you have your receipt?","Man: Yes, here it is. I'd prefer a refund rather than a replacement."],q:"What does the man want?",o:["A replacement","A refund","A discount","A repair"],c:"A refund",t:"He says: I'd prefer a refund."},{lines:["Woman: The training session has been moved from Tuesday to Thursday.","Man: Thursday? I have a client meeting that morning.","Woman: Don't worry, the training is in the afternoon, at two o'clock."],q:"When will the training take place?",o:["Tuesday morning","Thursday morning","Thursday afternoon","Tuesday afternoon"],c:"Thursday afternoon",t:"Thursday + in the afternoon."},{lines:["Narrator: Attention passengers. Flight 207 to Berlin has been delayed due to bad weather. Please remain near gate 12 for further announcements."],q:"Why is the flight delayed?",o:["A technical problem","Bad weather","A strike","A security check"],c:"Bad weather",t:"It is delayed due to bad weather."}]};
const SETS=[['Paires minimales','pairs'],['Nombres & heures','nums'],['Accentuation','stress'],['Mini-dialogues','dialogues']],$=s=>document.querySelector(s),shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let set=0,order=[],pos=0,answered=false,current=null,choices=[];const stats=(()=>{try{let x=JSON.parse(localStorage.getItem('htt_pron')||'{}');return x&&typeof x==='object'?x:{}}catch(e){return{}}})();
function save(){try{localStorage.setItem('htt_pron',JSON.stringify(stats))}catch(e){}}function say(text,rate=.92){if(!('speechSynthesis'in window)){announce('Synthèse vocale indisponible.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=localStorage.getItem('ht_accent')||'en-GB';u.rate=rate;u.onerror=()=>announce('Lecture audio impossible sur cet appareil.');speechSynthesis.speak(u)}catch(e){announce('Lecture audio impossible.')}}function announce(t){$('#live').textContent='';setTimeout(()=>$('#live').textContent=t,20)}function audioText(it){return it.lines?it.lines.map(x=>x.replace(/^[^:]+:\s*/,'' )).join(' '):it.s}
function resetOrder(){order=shuffle(BANK[SETS[set][1]].map((_,i)=>i));pos=0}function renderTabs(){let h=$('#tabs');h.innerHTML='';SETS.forEach((s,i)=>{let b=document.createElement('button');b.className='tab';b.type='button';b.textContent=s[0];b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===set));b.onclick=()=>{set=i;resetOrder();renderTabs();render()};h.appendChild(b)})}
function render(){answered=false;if(!order.length||pos>=order.length)resetOrder();current=BANK[SETS[set][1]][order[pos]];choices=shuffle(current.o);let p=$('#panel');p.innerHTML='<div class="small">Item '+(pos+1)+' / '+order.length+'</div><h2>'+SETS[set][0]+'</h2>'+(current.q?'<p><strong>Question :</strong> '+current.q+'</p>':'')+'<div class="actions"><button class="btn primary" id="play" type="button">▶ Écouter</button><button class="btn" id="slow" type="button">🐢 Plus lentement</button></div><div class="opts" id="opts" role="radiogroup" aria-label="Réponses"></div><div id="fb"></div><div id="transcriptHost"></div>';$('#play').onclick=()=>say(audioText(current),.92);$('#slow').onclick=()=>say(audioText(current),.68);let o=$('#opts');choices.forEach((x,i)=>{let b=document.createElement('button');b.className='opt';b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked','false');b.textContent=String.fromCharCode(65+i)+'. '+x;b.onclick=()=>choose(i,b);o.appendChild(b)});announce('Nouvel item. '+(pos+1)+' sur '+order.length+'.')}
function choose(i,b){if(answered)return;answered=true;let picked=choices[i],ok=picked===current.c,key=SETS[set][1];stats[key]=stats[key]||{c:0,t:0};stats[key].t++;if(ok)stats[key].c++;save();[...$('#opts').children].forEach((x,j)=>{x.disabled=true;x.setAttribute('aria-checked',String(j===i));if(choices[j]===current.c)x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});let f=$('#fb');f.className='fb';f.innerHTML=(ok?'✅ <strong>Correct.</strong> ':'❌ <strong>À revoir.</strong> ')+current.t+'<br><button class="btn" id="next" type="button" style="margin-top:10px">'+(pos<order.length-1?'Suivant →':'Nouvelle série ↺')+'</button>';if(current.lines){let h=$('#transcriptHost'),d=document.createElement('details');d.className='transcript';d.innerHTML='<summary>Afficher la transcription</summary><p>'+current.lines.map(x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>')+'</p>';h.appendChild(d)}$('#next').onclick=()=>{if(pos<order.length-1)pos++;else resetOrder();render()};$('#next').focus();announce(ok?'Réponse correcte.':'Réponse incorrecte.')}
renderTabs();resetOrder();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
