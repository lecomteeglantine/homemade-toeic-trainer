<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constructeur de phrases — Homemade TOEIC Trainer</title><style>body{margin:0;background:#fffdf8;color:#22324b;font-family:system-ui}.wrap{max-width:800px;margin:auto;padding:24px 16px 70px}.card{background:#fff;border:1px solid #ece6da;border-radius:18px;padding:20px;margin:16px 0}.bank,.answer,.row{display:flex;gap:8px;flex-wrap:wrap}.answer{min-height:70px;background:#f8f4ec;padding:12px;border-radius:14px}.tile,.btn{border:1px solid #ded7ca;background:#fff;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:#4f7cff;color:#fff}.btn:disabled,.tile:disabled{opacity:.55;cursor:not-allowed}:focus-visible{outline:3px solid #4f7cff;outline-offset:3px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats span{background:#f8f4ec;padding:8px 12px;border-radius:10px}</style><script src="progress-core.js"></script></head><body><main class="wrap"><a href="index.html">← Accueil</a><h1>🧩 Constructeur de phrases</h1><div class="stats"><span>Session : <b id="score">0</b></span><span>Série : <b id="streak">0</b></span><span>Record : <b id="best">0</b></span><span>Résolues au total : <b id="solved">0</b></span></div><section class="card"><p id="clue"></p><div class="answer" id="answer"></div><h3>Mots disponibles</h3><div class="bank" id="bank"></div><div class="row" style="margin-top:14px"><button class="btn primary" id="check" type="button">Vérifier</button><button class="btn" id="hint" type="button">Indice</button><button class="btn" id="reset" type="button">Recommencer la phrase</button></div><p id="feedback" role="status" aria-live="polite"></p><button class="btn primary" id="next" type="button" hidden>Phrase suivante →</button></section></main><script src="toeic-bank.js"></script><script src="toeic-bank-fixes.js"></script><script>
"use strict";const KEY='toeicSentenceBuilder_v1',$=id=>document.getElementById(id),FALL=[['The meeting has been postponed until Monday.','present perfect passif'],['Please send me the report by Friday.','impératif poli'],['She has worked here for ten years.','present perfect + durée'],['The package was delivered this morning.','passif passé'],['All employees must wear a badge.','modal d’obligation'],['We are looking forward to the conference.','expression figée'],['The contract will be signed next week.','futur passif'],['There is a problem with the order.','présentatif']];function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');return{best:Math.max(0,+s.best||0),solved:Math.max(0,+s.solved||0)}}catch(e){return{best:0,solved:0}}}function save(){localStorage.setItem(KEY,JSON.stringify({best:st.best,solved:st.solved}))}let st=load(),session=0,streak=0,validated=false;let pool=[...FALL];(TOEIC_BANK.VOCAB||[]).forEach(v=>{let s=(v.ex||'').trim(),wc=s.split(/\s+/).length;if(/^[A-Z]/.test(s)&&/[.?!]$/.test(s)&&wc>=4&&wc<=11)pool.push([s,'Mot-clé : '+v.w])});pool=[...new Map(pool.map(x=>[x[0],x])).values()];let order=pool.map((_,i)=>i).sort(()=>Math.random()-.5),op=0,cur,tiles=[],placed=[];function renderStats(){$('#score').textContent=session;$('#streak').textContent=streak;$('#best').textContent=st.best;$('#solved').textContent=st.solved}function newQ(){validated=false;$('#check').disabled=false;$('#hint').disabled=false;$('#reset').disabled=false;if(op>=order.length){order=order.sort(()=>Math.random()-.5);op=0}cur=pool[order[op++]];let words=cur[0].split(/\s+/),ids=words.map((_,i)=>i);do ids=ids.sort(()=>Math.random()-.5);while(ids.every((x,i)=>x===i)&&ids.length>1);tiles=ids.map((wi,i)=>({id:i,wi,text:words[wi],used:false}));placed=[];$('#clue').textContent='Point visé : '+cur[1];$('#feedback').textContent='';$('#next').hidden=true;render()}function render(){let a=$('#answer'),b=$('#bank');a.innerHTML='';b.innerHTML='';placed.forEach(id=>{let t=tiles.find(x=>x.id===id),x=document.createElement('button');x.className='tile';x.type='button';x.disabled=validated;x.textContent=t.text;x.onclick=()=>{t.used=false;placed=placed.filter(z=>z!==id);render()};a.appendChild(x)});tiles.filter(t=>!t.used).forEach(t=>{let x=document.createElement('button');x.className='tile';x.type='button';x.disabled=validated;x.textContent=t.text;x.onclick=()=>{t.used=true;placed.push(t.id);render()};b.appendChild(x)});renderStats()}function answer(){return placed.map(id=>tiles.find(x=>x.id===id).text).join(' ')}$('#check').onclick=()=>{if(validated)return;if(answer()===cur[0]){validated=true;session+=10;streak++;st.best=Math.max(st.best,streak);st.solved++;save();$('#feedback').textContent='✅ Correct !';$('#next').hidden=false;$('#check').disabled=true;$('#hint').disabled=true;$('#reset').disabled=true;$('#next').focus()}else{streak=0;$('#feedback').textContent='❌ Pas encore. Vérifie l’ordre des mots.'}renderStats()};$('#hint').onclick=()=>{$('#feedback').textContent='💡 La phrase commence par « '+cur[0].split(/\s+/)[0]+' ».'};$('#reset').onclick=()=>{tiles.forEach(t=>t.used=false);placed=[];render()};$('#next').onclick=newQ;newQ();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
